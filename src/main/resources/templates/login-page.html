<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카카오 로그인</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f5f6f8;
            color: #1f2328;
            font-family: "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
        }

        main {
            width: min(92vw, 420px);
            padding: 32px;
            border: 1px solid #d9dee8;
            border-radius: 8px;
            background: #ffffff;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
            line-height: 1.3;
        }

        p {
            margin: 0 0 20px;
            color: #5b6472;
            line-height: 1.6;
        }

        .login-link {
            display: inline-flex;
            width: 100%;
            text-decoration: none;
        }

        .login-link img {
            display: block;
            width: 100%;
            height: auto;
        }

        .meta {
            margin-top: 16px;
            font-size: 13px;
            color: #737b87;
            word-break: break-all;
        }
    </style>
</head>
<body>
<main>
    <h1>카카오 로그인</h1>
    <p>카카오 계정으로 로그인하면 서비스용 JWT를 발급합니다.</p>

    <a class="login-link" th:href="${kakaoLoginUrl}">
        <img th:src="@{/kakao-login.png}" alt="카카오 로그인 버튼" onerror="this.src='https://developers.kakao.com/tool/resource/static/img/button/login/full/ko/kakao_login_medium_narrow.png'">
    </a>

    <div class="meta">
        Redirect URI:
        <span th:text="${redirectUri}">http://localhost:8080/api/v1/auth/kakao/callback-page</span>
    </div>
</main>
</body>
</html>
